[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mcp-steam-game-price"
version = "0.1.0"
description = "MCP server for live Steam Store prices: search games, read the current price and discount in any region, and list what is on sale. No API key."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MCP Tools" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "steam",
    "steam-store",
    "game-prices",
    "discounts",
    "gaming",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "mcp>=1.9,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/tordagaz-ops/steam-game-price"
Repository = "https://github.com/tordagaz-ops/steam-game-price"
Issues = "https://github.com/tordagaz-ops/steam-game-price/issues"

[project.scripts]
steam-game-price = "mcp_steam_price.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_steam_price"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "README.md",
    "README.ru.md",
    "README.es.md",
    "LICENSE",
    "smithery.yaml",
    "Dockerfile",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: exercises the real Steam Store API (deselect with -m 'not live')",
    "e2e: spawns the server over stdio and speaks JSON-RPC to it",
]
